'use strict';
const SERVICE='03b80e5a-ede8-4b33-a751-6ce34ec4c700',CHAR='7772e5db-3868-4112-a1a9-f2669d106bf3';
const $=id=>document.getElementById(id);const noteTR=['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'],noteEN=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const active=new Map(),voices=new Map();let events=[],recording=false,recordStart=0,playback=false,playTimers=[],midiAccess=null,bleDevice=null,bleChar=null,source='',audio=null,recordingTick=null;const now=()=>performance.now();
function name(n){return ($('names').value==='tr'?noteTR:noteEN)[n%12]+(Math.floor(n/12)-1)}
function error(s){$('log').textContent=s}function setStatus(s,connected=false){$('status').textContent=connected?'● Bağlı':'● Bağlan';$('status').title=s;$('status').setAttribute('aria-label',s);$('status').className='connection'+(connected?' good':'');$('disconnect').disabled=!connected}
function ctx(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();return audio}
function soundOn(note,velocity=90,id=note){try{const c=ctx(),o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=440*Math.pow(2,(note-69)/12);g.gain.setValueAtTime(0.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(Math.max(.015,.17*velocity/127),c.currentTime+.025);o.connect(g);g.connect(c.destination);o.start();voices.set(id,{o,g,c})}catch(e){}}

function noteOn(n,v=90){if(n<0||n>127||active.has(n))return;const t=now();active.set(n,{t,v});if(recording)events.push({kind:'on',n,v,t:t-recordStart});soundOn(n,v,'live-'+n);highlight();render()}
function noteOff(n){if(!active.has(n))return;active.delete(n);if(recording)events.push({kind:'off',n,v:0,t:now()-recordStart});soundOff('live-'+n);highlight();render()}
function midiMessage(status,n,v){if(n===undefined||v===undefined)return;const cmd=status&0xf0;if(cmd===0x90&&v>0)noteOn(n,v);else if(cmd===0x80||(cmd===0x90&&v===0))noteOff(n)}
function disconnect(){if(midiAccess){for(const i of midiAccess.inputs.values())i.onmidimessage=null;midiAccess.onstatechange=null;midiAccess=null}if(bleChar){try{bleChar.stopNotifications()}catch(e){}bleChar=null}if(bleDevice?.gatt?.connected)bleDevice.gatt.disconnect();bleDevice=null;source='';for(const n of [...active.keys()])noteOff(n);setStatus('MIDI bağlı değil')}
$('disconnect').onclick=()=>{disconnect();$('connectionMenu').hidden=true};$('status').onclick=()=>{if($('status').classList.contains('good')){$('connectionMenu').hidden=!$('connectionMenu').hidden}else $('ble').click()};$('more').onclick=()=>{$('connectionMenu').hidden=!$('connectionMenu').hidden};
$('usb').onclick=async()=>{error('');try{if(!navigator.requestMIDIAccess)throw Error('Tarayıcı Web MIDI desteklemiyor.');disconnect();midiAccess=await navigator.requestMIDIAccess({sysex:false});source='web';$('connectionMenu').hidden=true;const bind=()=>{const ins=[...midiAccess.inputs.values()].filter(x=>x.state==='connected');for(const input of midiAccess.inputs.values())input.onmidimessage=null;ins.forEach(i=>i.onmidimessage=e=>{const d=e.data;midiMessage(d[0],d[1],d[2])});setStatus(ins.length?'MIDI: '+ins.map(x=>x.name).join(', '):'MIDI aygıtı bekleniyor',ins.length>0)};midiAccess.onstatechange=bind;bind()}catch(e){error(e.message);setStatus('MIDI bağlantı hatası')}};
// BLE MIDI parser: header, timestamp-low, status and MIDI data; supports running status and multiple events.
function parseBLE(view){const a=new Uint8Array(view.buffer,view.byteOffset,view.byteLength);if(a.length<3)return;let i=1,running=0;while(i<a.length){if(!(a[i]&0x80)){i++;continue}i++;if(i>=a.length)break;let status=a[i];if(status>=0x80&&status<0xf0){running=status;i++}else if(status>=0xf0){i++;continue}else if(running){status=running}else continue;const type=status&0xf0;const count=(type===0xc0||type===0xd0)?1:2;if(i+count>a.length)break;const n=a[i++],v=count===2?a[i++]:0;if(type===0x80||type===0x90)midiMessage(status,n,v);while(i<a.length&&!(a[i]&0x80)&&running){if(i+count>a.length)break;const n2=a[i++],v2=count===2?a[i++]:0;if(type===0x80||type===0x90)midiMessage(status,n2,v2)}}}
$('ble').onclick=async()=>{error('');try{if(!navigator.bluetooth)throw Error('Web Bluetooth kullanılamıyor. HTTPS ve uyumlu tarayıcı gerekli.');disconnect();const d=await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE]}],optionalServices:[SERVICE]});bleDevice=d;d.addEventListener('gattserverdisconnected',()=>{if(bleDevice===d){bleChar=null;bleDevice=null;setStatus('Bluetooth bağlantısı kesildi')}});const server=await d.gatt.connect(),svc=await server.getPrimaryService(SERVICE);bleChar=await svc.getCharacteristic(CHAR);await bleChar.startNotifications();bleChar.addEventListener('characteristicvaluechanged',e=>parseBLE(e.target.value));source='ble';$('connectionMenu').hidden=true;setStatus('Bluetooth: '+(d.name||'BLE MIDI'),true)}catch(e){if(e.name!=='NotFoundError')error(e.message);setStatus('Bluetooth bağlı değil')}};
// IndexedDB: tarayıcıda kalıcı, isim istemeyen en fazla 30 kayıt.
const DB_NAME='notalarim-midi-library', STORE='recordings';
let dbPromise=null, nextSequence=1, libraryPlayingId=null;
function openDB(){if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{if(!window.indexedDB){reject(Error('Tarayıcı kayıt depolamasını desteklemiyor'));return}const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return dbPromise}
async function getLibrary(){const db=await openDB();return new Promise((resolve,reject)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result.sort((a,b)=>a.id-b.id));r.onerror=()=>reject(r.error)})}

async function deleteLibrary(id){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
const playSvg='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',trashSvg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 4h4M7 7l1 13h8l1-13M10 10v7m4-7v7"/></svg>';
// Compact staff preview generated directly from each saved MIDI event sequence.
function libraryNotation(savedEvents){
 const opened=new Map(),notes=[];

  if(e.kind==='on'){opened.set(e.n,e)}

 const width=Math.max(310,85+groups.length*37),height=82;
 let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="${notes.length} nota önizlemesi">`;
 for(let k=0;k<5;k++){const y=19+k*10;svg+=`<line x1="12" y1="${y}" x2="${width-9}" y2="${y}" stroke="#9ca3af" stroke-width="1"/>`}

 groups.forEach((g,i)=>{const x=75+i*37;g.notes.forEach(n=>{
  const step=staffStep(n.n),y=59-step*5;
  if(y<19)for(let yy=9;yy>=y;yy-=10)svg+=`<line x1="${x-10}" y1="${yy}" x2="${x+11}" y2="${yy}" stroke="#9ca3af"/>`;

}
async function refreshLibrary(){try{const items=await getLibrary();$('libraryCount').textContent=items.length+'/30';const box=$('libraryItems');box.replaceChildren();if(!items.length){box.innerHTML='<div class="libraryEmpty">Henüz kayıt yok</div>';return}for(const item of items){const row=document.createElement('div');row.className='libraryItem';const title=document.createElement('div');title.className='libraryTitle';title.textContent='Kayıt '+item.id;const entry=document.createElement('div');entry.className='libraryEntry';const preview=document.createElement('div');preview.className='libraryStaff';preview.innerHTML=libraryNotation(item.events);entry.append(title,preview);const play=document.createElement('button');play.title='Dinle: Kayıt '+item.id;play.setAttribute('aria-label',play.title);play.innerHTML=playSvg;play.onclick=()=>{if(recording)return;stopPlayback();events=item.events.map(e=>({...e}));$('bpm').value=item.bpm||120;render();$('play').disabled=false;$('export').disabled=false;libraryPlayingId=item.id;$('play').click();refreshLibrary()};const remove=document.createElement('button');remove.className='deleteItem';remove.title='Sil: Kayıt '+item.id;remove.setAttribute('aria-label',remove.title);remove.innerHTML=trashSvg;remove.onclick=async()=>{if(!confirm('Kayıt '+item.id+' silinsin mi?'))return;try{if(libraryPlayingId===item.id)stopPlayback();await deleteLibrary(item.id);await refreshLibrary()}catch(e){error(e.message)}};row.append(entry,play,remove);box.append(row)}}catch(e){error('Kütüphane açılamadı: '+e.message)}}
$('libraryButton').onclick=async()=>{if(recording){error('Önce kaydı bitir.');return}stopPlayback();$('studioView').hidden=true;$('libraryView').hidden=false;await refreshLibrary()};$('backLibrary').onclick=()=>{stopPlayback();$('libraryView').hidden=true;$('studioView').hidden=false};
async function storeFinishedRecording(){if(!events.some(e=>e.kind==='on'))return;try{const old=await getLibrary();if(old.length>=30){alert('Kütüphane dolu! En fazla 30 kayıt saklanabilir. Yeni kayıt için kütüphaneden eski kayıtları silin.');error('Kayıt saklanmadı. Eski kayıtları silin veya MIDI olarak indirin.');return}const number=old.reduce((m,x)=>Math.max(m,x.number||0),0)+1;await saveLibrary({number,title:'Kayıt '+number,createdAt:Date.now(),bpm:+$('bpm').value||120,events:events.map(e=>({...e}))});error('');await refreshLibrary()}catch(e){error('Kayıt saklanamadı: '+e.message)}}
function finishActive(){const t=now()-recordStart;for(const [n] of active)events.push({kind:'off',n,v:0,t});}
$('record').onclick=async()=>{if($('libraryView').hidden===false)return;try{if((await getLibrary()).length>=30){alert('Kütüphane dolu (30/30)! Yeni kayıt yapabilmek için kütüphaneden eski kayıtları silin.');return}}catch(e){error('Kütüphane kontrol edilemedi: '+e.message);return}stopPlayback();events=[];recordStart=now();recording=true;$('record').disabled=true;$('stop').disabled=false;$('play').disabled=true;$('export').disabled=true;$('recordstatus').textContent='● Kayıt...' ;render()};
$('stop').onclick=async()=>{if(!recording)return;finishActive();recording=false;$('record').disabled=false;$('stop').disabled=true;$('play').disabled=!events.length;$('export').disabled=!events.length;$('recordstatus').textContent='' ;render();await storeFinishedRecording()};
function stopPlayback(){playTimers.forEach(clearTimeout);playTimers=[];for(const id of [...voices.keys()])if(String(id).startsWith('play-'))soundOff(id);playback=false;$('stopplay').disabled=true;$('play').disabled=!events.length||recording}
$('stopplay').onclick=stopPlayback;
$('play').onclick=()=>{if(recording||!events.length)return;stopPlayback();playback=true;$('play').disabled=true;$('stopplay').disabled=false;const started=new Set();for(const e of events){const timer=setTimeout(()=>{if(!playback)return;const id='play-'+e.n;if(e.kind==='on'){soundOff(id);soundOn(e.n,e.v,id);started.add(e.n)}else{soundOff(id);started.delete(e.n)}},Math.max(0,e.t));playTimers.push(timer)}const last=events.at(-1).t;playTimers.push(setTimeout(stopPlayback,last+450))};
$('clear').onclick=()=>{stopPlayback();if(recording){recording=false;$('record').disabled=false;$('stop').disabled=true;} events=[];$('play').disabled=true;$('export').disabled=true;$('recordstatus').textContent='' ;render()};
function notesFromEvents(){const opened=new Map(),out=[];for(const e of events){if(e.kind==='on'){if(opened.has(e.n)){const old=opened.get(e.n);out.push({n:e.n,t:old.t,d:Math.max(60,e.t-old.t)});}opened.set(e.n,e)}else if(opened.has(e.n)){const old=opened.get(e.n);out.push({n:e.n,t:old.t,d:Math.max(60,e.t-old.t)});opened.delete(e.n)}}const end=recording?now()-recordStart:(events.at(-1)?.t||0);for(const [n,e] of opened)out.push({n,t:e.t,d:Math.max(60,end-e.t)});if(recording)for(const [n,e] of active)if(!opened.has(n))out.push({n,t:e.t-recordStart,d:Math.max(60,now()-e.t)});return out.sort((a,b)=>a.t-b.t||a.n-b.n)}
const diatonic=[0,2,4,5,7,9,11];function staffStep(n){const oct=Math.floor(n/12)-1,pc=n%12;let idx=diatonic.reduce((best,x,i)=>Math.abs(x-pc)<Math.abs(diatonic[best]-pc)?i:best,0);return(oct-4)*7+idx-2} // E4 bottom line -> step 0
function symbol(d){const beat=60000/(+ $('bpm').value||120),b=d/beat;return b>=3?'whole':b>=1.5?'half':b>=.75?'quarter':b>=.375?'eighth':'sixteenth'}
function render(){const notes=notesFromEvents(),w=Math.max(740,Math.min(2200,150+notes.length*54)),grouped=[];for(const n of notes){let group=grouped.find(g=>Math.abs(g.t-n.t)<35);if(!group){group={t:n.t,notes:[]};grouped.push(group)}group.notes.push(n)}const width=Math.max(740,160+grouped.length*62),height=240;let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="${notes.length} kayıtlı nota">`;for(let k=0;k<5;k++){const y=115+k*13;s+=`<line x1="38" y1="${y}" x2="${width-25}" y2="${y}" stroke="#475569" stroke-width="1.4"/>`}s+=`<text x="47" y="164" font-family="serif" font-size="67" fill="#1e40af">𝄞</text>`;grouped.forEach((g,i)=>{const x=140+i*62;g.notes.forEach(n=>{const st=staffStep(n.n),y=167-st*6.5,kind=symbol(n.d),open=kind==='whole'||kind==='half';for(let ly=167;ly<=y;ly+=13)if(y<115&&ly>=115){};if(y<115){for(let yy=102;yy>=y-1;yy-=13)s+=`<line x1="${x-13}" y1="${yy}" x2="${x+14}" y2="${yy}" stroke="#64748b"/>`}if(y>167){for(let yy=180;yy<=y+1;yy+=13)s+=`<line x1="${x-13}" y1="${yy}" x2="${x+14}" y2="${yy}" stroke="#64748b"/>`}const sharp=[1,3,6,8,10].includes(n.n%12);if(sharp)s+=`<text x="${x-21}" y="${y+5}" font-size="17" fill="#334155">♯</text>`;s+=`<ellipse cx="${x}" cy="${y}" rx="10" ry="7" transform="rotate(-18 ${x} ${y})" fill="${open?'white':'#1d4ed8'}" stroke="#1d4ed8" stroke-width="2"/>`;if(kind!=='whole'){s+=`<line x1="${x+9}" y1="${y}" x2="${x+9}" y2="${y-35}" stroke="#1d4ed8" stroke-width="2"/>`;if(kind==='eighth'||kind==='sixteenth')s+=`<path d="M ${x+9} ${y-35} q 21 7 8 22${kind==='sixteenth'?` M ${x+9} ${y-26} q 21 7 8 22`:''}" fill="none" stroke="#1d4ed8" stroke-width="2"/>`}s+=`<text x="${x}" y="215" text-anchor="middle" font-size="12" fill="#334155">${name(n.n)}</text>`})});s+='</svg>';$('staff').innerHTML=s;$('count').textContent=notes.length+' nota · '+grouped.length+' basış';}
$('names').onchange=()=>{render();makeKeyboard()};$('bpm').onchange=render;
function highlight(){document.querySelectorAll('.key').forEach(k=>k.classList.toggle('on',active.has(+k.dataset.note)))}
function makeKeyboard(){const el=$('keyboard');el.innerHTML='';for(let n=48;n<=84;n++){const k=document.createElement('button');k.type='button';k.className='key'+([1,3,6,8,10].includes(n%12)?' black':'');k.dataset.note=n;k.textContent=name(n);k.onpointerdown=e=>{e.preventDefault();k.setPointerCapture(e.pointerId);noteOn(n)};k.onpointerup=k.onpointercancel=()=>noteOff(n);el.append(k)}highlight()}
function vlq(n){n=Math.max(0,Math.floor(n));const a=[n&127];while(n>>=7)a.unshift((n&127)|128);return a}function be16(n){return[(n>>8)&255,n&255]}function be32(n){return[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255]}
$('export').onclick=()=>{if(!events.length)return;const bpm=Math.max(40,Math.min(240,+$('bpm').value||120)),ticks=480,sorted=events.map(e=>({...e,tick:Math.round(e.t*bpm*ticks/60000)})).sort((a,b)=>a.tick-b.tick||(a.kind==='off'?-1:1));let data=[0,255,81,3,...be32(Math.round(60000000/bpm)).slice(1)],prev=0;for(const e of sorted){data.push(...vlq(e.tick-prev),e.kind==='on'?0x90:0x80,e.n,e.kind==='on'?e.v:0);prev=e.tick}data.push(0,255,47,0);const bytes=new Uint8Array([77,84,104,100,...be32(6),...be16(0),...be16(1),...be16(ticks),77,84,114,107,...be32(data.length),...data]);const url=URL.createObjectURL(new Blob([bytes],{type:'audio/midi'}));const a=document.createElement('a');a.href=url;a.download='canli-notalar.mid';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
